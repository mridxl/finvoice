[project]
name = "finvoice"
version = "0.1.0"
description = "Real-time voice assistant for 30-day financial planning"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: Pipecat 1.x has had breaking changes across minor versions.
    # cartesia and openai need no extra — openai is a core dependency, and the
    # Cartesia service runs over core websockets.
    "pipecat-ai[daily,deepgram]==1.10.0",
    # What pipecat.services.google.llm imports, taken directly rather than via
    # pipecat-ai[google]: that extra also pulls Google's Cloud Speech and
    # Text-to-Speech clients and grpcio, and we use Deepgram and Cartesia for
    # those. `google-genai` alone is not enough — the module also imports
    # google.api_core.exceptions, which does not come with it. Safe to pick
    # apart only because the pipecat version is pinned exactly.
    "google-genai>=1.68.0,<3",
    "google-api-core>=2.20,<3",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",  # fastapi.testclient
    "ruff>=0.8",
    # What `python -m pipecat.evals` needs, taken directly rather than via
    # pipecat-ai[cli]: that extra also pulls a vector store and a set of
    # tree-sitter grammars for the scaffolding commands, which no eval touches.
    # Safe to pick apart only because the pipecat version is pinned exactly.
    "typer>=0.20,<1",
    "rich>=13,<14",
    "jinja2>=3.1,<4",
    "questionary>=2,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
